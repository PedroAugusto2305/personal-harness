[package]
name = "harness"
version = "0.9.6"
description = "MÊTIS: OS pessoal e ADE no Mac"
authors = ["Pedro Aquino"]
edition = "2024"

[lib]
# O sufixo _lib evita conflito entre o nome da lib e o do binário.
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: navegador embutido (webview filho da janela); devtools: inspetor também no app empacotado.
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
