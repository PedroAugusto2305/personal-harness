[project]
name = "harness-core"
version = "1.0.0"
description = "Núcleo da MÊTIS (antes Personal Harness): terminais dos agentes, sessões e telemetria do Claude Code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "keyring>=25",
    "model2vec>=0.10",
    "pillow>=11",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
harness-core = "harness_core.__main__:main"
metis = "harness_core.cli:main"
# nome antigo do comando, mantido enquanto a troca para metis assenta
harness = "harness_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
# O onnxruntime não publica mais wheels para Mac Intel. O faster-whisper só o usa no
# filtro de silêncio (VAD), que a MÊTIS não liga; sem ele, o resto funciona.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
